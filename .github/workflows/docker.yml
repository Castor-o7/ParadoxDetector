# Builds the Docker image on every pull request and checks it actually serves Paradox Detector.
# Pushes to main also publish it as ghcr.io/<owner>/paradoxdetector:latest (and :<short sha>), so a
# server can pull instead of building. Tagged releases publish :<version> (release.yml).

name: Docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# A new push to a pull request cancels the run it supersedes. Runs on main are never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: paradox:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          docker run -d --name pd -p 8787:8787 -e PARADOX_PASSWORD=ci-only paradox:test
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pd)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' pd | grep -qx healthy
          check() {  # path, expected status, [password]
            got=$(curl -s -o /dev/null -w '%{http_code}' ${3:+-u "x:$3"} "http://127.0.0.1:8787$1")
            [ "$got" = "$2" ] || { echo "$1 returned $got, expected $2"; exit 1; }
          }
          check /healthz 200
          check / 401                          # the password guard is on
          check / 200 ci-only
          check /api/beacons 200 ci-only
          check "/api/scan?ip=10.0.0.1" 400 ci-only   # rejected before any beacon call
          check /nope 404 ci-only
          # Headless commands work inside the image.
          docker run --rm paradox:test paradox --version
          docker run --rm paradox:test paradox beacons
          # Runs unprivileged.
          test "$(docker exec pd id -u)" != 0
          # Nothing private ships in the image: no keys file, no scan history, no source tree.
          ! docker exec pd find / -xdev \( -name '.env' -o -name 'history.sqlite3' \) -not -path '/var/lib/paradox/*' 2>/dev/null | grep .
          docker exec pd test ! -e /src
          # Refuses to start exposed without a password.
          ! docker run --rm paradox:test

      - name: Logs
        if: always()
        run: docker logs pd || true

      - name: Publish
        if: github.event_name == 'push'
        shell: bash
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag paradox:test "$image:latest"
          docker tag paradox:test "$image:${GITHUB_SHA::7}"
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA::7}"
