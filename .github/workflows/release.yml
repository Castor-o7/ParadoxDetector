# Cuts a release when a version tag is pushed:
#
#   1. bump `version` in pyproject.toml and __version__ in paradox/__init__.py, merge to main
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# The run checks the tag matches both version strings, builds the wheel and sdist, proves the
# wheel installs and runs, creates a GitHub Release with them attached and generated notes, and
# publishes ghcr.io/<owner>/paradoxdetector:<version> and :<major.minor>.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never run two releases at once; queue instead of cancelling a half-published one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Tag matches the package version
        id: version
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME#v}
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          package=$(python -c "import paradox; print(paradox.__version__)")
          if [ "$tag" != "$project" ] || [ "$tag" != "$package" ]; then
            echo "::error::tag v$tag, pyproject.toml $project, paradox/__init__.py $package must all match"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - run: python -m unittest discover -s tests
      - run: pip install build && python -m build

      - name: The wheel installs and runs
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/v/bin/paradox" --version)" = "paradox ${{ steps.version.outputs.version }}"
          "$RUNNER_TEMP/v/bin/paradox" beacons

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-running a release whose GitHub Release already exists just refreshes its files.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        shell: bash
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          v=${{ needs.build.outputs.version }}
          echo "list=$image:$v,$image:${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
