# docker compose up -d   ->  http://127.0.0.1:8787
# Put API keys and PARADOX_PASSWORD in .env (paradox init, or copy paradox/env.example).
services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"     # loopback only; front it with a TLS reverse proxy to expose it
    volumes:
      - paradox:/var/lib/paradox
    restart: unless-stopped

  # Headless sensor sharing the same history. It rescans tracked IPs every
  # 6 hours. To follow host logs too, mount them and add --log, e.g.
  #   volumes: [/var/log/auth.log:/logs/auth.log:ro]
  #   command: [paradox, watch, --rescan-every, "6", --log, /logs/auth.log]   # set PARADOX_WEBHOOK in .env for alerts
  watch:
    build: .
    env_file: .env
    command: ["paradox", "watch", "--rescan-every", "6"]
    volumes:
      - paradox:/var/lib/paradox
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  paradox:
