# docker compose up -d   ->  http://127.0.0.1:8787
# Put API keys and PARADOX_PASSWORD in .env (see .env.example).
services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"     # loopback only; front it with a TLS reverse proxy to expose it
    volumes:
      - paradox-data:/app/data
      - paradox-cache:/app/.cache
    restart: unless-stopped

  # Rescans every tracked IP every 6 hours so the history charts and lag
  # measurements fill in. Shares the history database with the web app.
  rescan:
    build: .
    env_file: .env
    command: ["sh", "-c", "while true; do sleep 21600; python -m paradox --rescan-tracked; done"]
    volumes:
      - paradox-data:/app/data
      - paradox-cache:/app/.cache
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  paradox-data:
  paradox-cache:
